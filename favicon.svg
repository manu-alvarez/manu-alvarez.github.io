<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#cbd5e1" />
      <stop offset="70%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Obsidian Base -->
  <rect width="100" height="100" rx="22" fill="#04060a"/>

  <!-- Outer Reactor Ring -->
  <circle cx="50" cy="50" r="44" fill="none" stroke="url(#cyanPurple)" stroke-width="2.5" opacity="0.6"/>
  <circle cx="50" cy="50" r="41" fill="none" stroke="#00f0ff" stroke-width="1.2" stroke-dasharray="8 4" opacity="0.8"/>
  <circle cx="50" cy="50" r="37" fill="#090d16" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

  <!-- Energy Notches -->
  <line x1="50" y1="3" x2="50" y2="10" stroke="#00f0ff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="50" y1="90" x2="50" y2="97" stroke="#a855f7" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="3" y1="50" x2="10" y2="50" stroke="#00f0ff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="90" y1="50" x2="97" y2="50" stroke="#a855f7" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Bold Cinematic MSB Typography -->
  <text x="50" y="59" 
        font-family="-apple-system, BlinkMacSystemFont, 'Outfit', 'Inter', 'Impact', sans-serif" 
        font-size="27" 
        font-weight="900" 
        letter-spacing="-1.5" 
        text-anchor="middle" 
        fill="url(#metalGrad)" 
        stroke="#00f0ff" 
        stroke-width="1.2" 
        filter="url(#glow)">MSB</text>

  <!-- Energy Arc Highlights -->
  <path d="M 24,70 Q 50,78 76,70" fill="none" stroke="url(#cyanPurple)" stroke-width="2.5" stroke-linecap="round" opacity="0.9" filter="url(#glow)"/>
</svg>